name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalador npx (setup, status, uninstall)
        run: |
          set -e
          export HOME="$(mktemp -d)"; mkdir -p "$HOME/.claude"
          node bin/bizagi-steroids.mjs setup
          test -f "$HOME/.agents/skills/bizagi/SKILL.md"
          test -f "$HOME/.claude/skills/bizagi/scripts/bizagi_cli.py"
          node bin/bizagi-steroids.mjs status
          node bin/bizagi-steroids.mjs uninstall
          test ! -e "$HOME/.agents/skills/bizagi"
      - name: Validar y generar los ejemplos
        run: |
          set -e
          for spec in examples/*.json tests/specs/*.json; do
            python skills/bizagi/scripts/bizagi_cli.py validate "$spec"
            python skills/bizagi/scripts/bizagi_cli.py generate "$spec" -o /tmp/out.bpmn --svg /tmp/out.svg
            python skills/bizagi/scripts/bizagi_cli.py read /tmp/out.bpmn -o /tmp/roundtrip.json
            python skills/bizagi/scripts/bizagi_cli.py validate /tmp/roundtrip.json
            python skills/bizagi/scripts/bizagi_cli.py doc /tmp/out.bpmn -o /tmp/out.md
            python skills/bizagi/scripts/bizagi_cli.py docx "$spec" -o /tmp/out.docx --no-png
            python skills/bizagi/scripts/bizagi_cli.py docx "$spec" -o /tmp/tpl.docx --no-png --template skills/bizagi/plantillas/plantilla-ejemplo.docx
            python -c "import zipfile,re,xml.dom.minidom as m;z=zipfile.ZipFile('/tmp/tpl.docx');[m.parseString(z.read(n)) for n in z.namelist() if n.endswith(('.xml','.rels'))];d=z.read('word/document.xml').decode();assert not re.findall(r'\{\{[^}]*\}\}',d),'marcadores sin rellenar';print('plantilla ok')"
            python -c "import zipfile,xml.dom.minidom as m;z=zipfile.ZipFile('/tmp/out.docx');[m.parseString(z.read(n)) for n in z.namelist() if n.endswith(('.xml','.rels'))];print('docx ok')"
          done
          python skills/bizagi/scripts/bizagi_cli.py build examples/solicitud-compra.json -d /tmp/build
          test -f /tmp/build/solicitud-de-compra.bpmn && test -f /tmp/build/solicitud-de-compra.docx
          for bpmn in examples/*.bpmn; do
            python skills/bizagi/scripts/bizagi_cli.py validate "$bpmn"
          done
