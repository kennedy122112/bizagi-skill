<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1230"/>
      <stop offset="0.55" stop-color="#2a1626"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
