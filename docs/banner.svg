    <rect x="490" y="282" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="570" y="304" text-anchor="middle">+ tu proceso…</text>
