  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glow2)"/>

  <text x="70" y="150" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1">bizagi-skill</text>
